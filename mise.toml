[tools]
jq = "latest"

[env]
'_'.file = { path = ".env.local" }

[tasks.test]
description = "run the unit tests"
run = "cargo test"

[tasks.lint]
description = "clippy over all targets"
run = "cargo clippy --all-targets"

[tasks.check]
description = "tests + lint"
depends = ["test", "lint"]

[tasks.build]
description = "debug build"
run = "cargo build"
