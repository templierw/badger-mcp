[package]
name = "badger-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "3.5.1", features = ["transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "io-std"] }
